<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edson-pagina</title>
    <style>
        body {
            margin: 0 auto;
            max-width: 800px;
        }

        main {
            background-color: #183c63;
            color: white;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
        }

        img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Meu Blog Tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </main>

    <header>
        <img src="imagem-blog.webp" alt="">
        <h2>Meu Primeiro Post</h2>
        <p>Por: Marcelo Paludetto</p>
        <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
        
        <button>❤️ <span>0</span></button>
        <button>👍 <span>0</span></button>
    </header>

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function(botao) {
            let curtiu = false;

            botao.addEventListener("click", function() {
                console.log("fui clicado");
                let texto = botao.querySelector("span");

                if (curtiu === false) {
                    texto.textContent++;
                    curtiu = true;
                } else {
                    texto.textContent--;
                    curtiu = false;
                }
            });
        });
    </script>
</body>
</html>
